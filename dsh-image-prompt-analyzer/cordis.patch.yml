# ============================================================================
# dsh-image-prompt-analyzer —— bundle patch
# ============================================================================
# 把本插件的 Host 行挂进 DSH 配置树。
#
# - insert：往配置树添加新的插件行（entry）
# - id 必须全局唯一，用包名以免与其它插件冲突
# - Host 行（name: '@RimeLumen/dsh-image-prompt-analyzer'）解析到 index.js
# - config 里的字段只放"进程级"开关；真正的业务配置全部在包内 configs/*.json，
#   由插件自己在运行时读取与校验
#
# 【为什么这里只有一行】
#   本插件的全部能力都通过工具暴露给模型；浏览器半侧只负责把 comfyui_get_job
#   的结果画成卡片，没有独立页面，也没有 HTTP 路由。
#   client.js 不在 patch 里出现：它在 package.json 的 `dsh.client` 与
#   `exports["./client"]` 里声明，由 DSH 的模块系统自己扫描并注入。
#   注意不要在 patch 里写 `name: '.../client'` —— 那会让宿主把它当成
#   第二个 **Host** 插件去 import，而 client.js 的第一句是
#   `window.__ModuleLoader__.load(...)`，宿主进程里没有 window，
#   结果是启动时一句「1 entry did not activate ... failed to import」。
#
# 【dataDir 为什么不写】
#   词库导入一次就该一直在，而插件包升级是整包替换——写在包里的数据会被删掉。
#   留空时插件把数据放到系统用户目录（Windows: %LOCALAPPDATA%\dsh-image-prompt-analyzer，
#   macOS: ~/Library/Application Support/dsh-image-prompt-analyzer，其余: XDG_DATA_HOME）。
#   要放别处就填一个**绝对路径**；填相对路径仍按包内解析（只给老安装兼容用）。
# ============================================================================

- insert:
    - id: '@RimeLumen/dsh-image-prompt-analyzer'
      name: '@RimeLumen/dsh-image-prompt-analyzer'
      config:
        configDir: './configs'
        logDir: './logs'
